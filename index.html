<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Realistic 3D Galvanometer Simulation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <style>
        :root {
            --bg-color: #0f1115;
            --card-bg: rgba(25, 28, 36, 0.9);
            --accent-gold: #e2b774;
            --text-main: #f0f0f0;
            --text-muted: #9aa0a6;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* แผงควบคุมและหัวข้อด้านบน */
        .control-panel {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            z-index: 10;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 12px 16px;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        h1 {
            color: var(--accent-gold);
            font-size: 0.95rem;
            margin: 0;
        }

        .live-value {
            font-size: 0.9rem;
            color: #4da6ff;
            font-weight: bold;
        }

        /* สไลเดอร์ปรับกระแส */
        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .slider-group label {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent-gold);
            height: 6px;
            background: #444;
            border-radius: 3px;
            outline: none;
        }

        /* กล่องอวตารผู้ช่วยด้านล่าง */
        .avatar-container {
            position: absolute;
            bottom: 20px;
            left: 15px;
            right: 15px;
            z-index: 10;
            background: linear-gradient(135deg, #1e222d, #141721);
            border: 2px solid var(--accent-gold);
            border-radius: 14px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 8px 30px rgba(226, 183, 116, 0.2);
            transition: transform 0.2s ease;
        }

        .avatar-img {
            font-size: 2.2rem;
            background: #282c37;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            flex-shrink: 0;
            border: 2px solid var(--accent-gold);
        }

        .avatar-speech {
            flex-grow: 1;
            overflow: hidden;
        }

        .avatar-title {
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--accent-gold);
            display: block;
            margin-bottom: 2px;
        }

        .avatar-desc {
            font-size: 0.75rem;
            color: #d1d5db;
            margin: 0;
            line-height: 1.35;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="control-panel">
        <div class="header-row">
            <h1>กัลวานอมิเตอร์ (จำลองสมจริง)</h1>
            <span id="currentReadout" class="live-value">0.0 mA</span>
        </div>
        <div class="slider-group">
            <label for="currentSlider">ป้อนกระแสไฟฟ้าผ่านขดลวด (ลากเพื่อดูเข็มขยับ):</label>
            <input type="range" id="currentSlider" min="-5" max="5" step="0.1" value="0">
        </div>
    </div>

    <div class="avatar-container" id="avatarBox">
        <div class="avatar-img">🤖</div>
        <div class="avatar-speech">
            <span class="avatar-title" id="avatarTitle">ผู้ช่วยอัจฉริยะ 3D</span>
            <p class="avatar-desc" id="avatarDesc">ลองขยับสไลเดอร์เพื่อดูเข็มเบี่ยงเบน หรือแตะชิ้นส่วนใน 3D เพื่อดูคำอธิบายครับ!</p>
        </div>
    </div>

    <script>
        // 1. ตั้งค่า Scene, Camera, Renderer
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f1115);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3, 6.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 + 0.1; // ไม่ให้มองจากใต้พื้น

        // 2. แสงสว่าง
        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        // 3. สร้างพื้นผิวหน้าปัดสเกลด้วย Canvas Texture
        function createScaleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            
            // พื้นหลังขาวนวลแบบหน้าปัดเครื่องมือวัด
            ctx.fillStyle = '#f8f9fa';
            ctx.fillRect(0, 0, 512, 256);

            // ขอบโค้งสเกล
            ctx.strokeStyle = '#333333';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(256, 220, 160, Math.PI * 1.15, Math.PI * 1.85);
            ctx.stroke();

            // ขีดสเกลและตัวเลข (-5 ถึง 5)
            ctx.fillStyle = '#111111';
            ctx.font = 'bold 16px Arial';
            ctx.textAlign = 'center';

            for (let i = -5; i <= 5; i++) {
                // คำนวณมุมตามสัดส่วน
                const ratio = (i + 5) / 10;
                const angle = Math.PI * 1.15 + ratio * (Math.PI * 0.7);
                
                const x1 = 256 + Math.cos(angle) * 160;
                const y1 = 220 + Math.sin(angle) * 160;
                const x2 = 256 + Math.cos(angle) * (i % 5 === 0 ? 140 : 148);
                const y2 = 220 + Math.sin(angle) * (i % 5 === 0 ? 140 : 148);

                ctx.strokeStyle = i === 0 ? '#cc0000' : '#333333';
                ctx.lineWidth = i % 5 === 0 ? 3 : 1.5;
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();

                if (i % 5 === 0 || i === -2 || i === 2) {
                    const tx = 256 + Math.cos(angle) * 115;
                    const ty = 220 + Math.sin(angle) * 115;
                    ctx.fillText(i.toString(), tx, ty + 6);
                }
            }

            // ชื่อยี่ห้อจำลองบนหน้าปัด
            ctx.font = 'bold 12px Arial';
            ctx.fillStyle = '#555555';
            ctx.fillText('MOVING-COIL GALVANOMETER', 256, 110);
            ctx.fillText('mA', 256, 135);

            return new THREE.CanvasTexture(canvas);
        }

        // 4. สร้างโครงสร้างเครื่องมือวัดแบบสมจริง (Galvanometer Casing Assembly)
        const galvanometerGroup = new THREE.Group();
        scene.add(galvanometerGroup);

        function createMesh(geometry, material, x, y, z, name, parentGroup = galvanometerGroup) {
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(x, y, z);
            mesh.name = name;
            parentGroup.add(mesh);
            return mesh;
        }

        // A. ตัวเครื่องภายนอก (Meter Casing - สีดำด้าน)
        const casingMat = new THREE.MeshStandardMaterial({ color: 0x1e222d, roughness: 0.5, metalness: 0.2 });
        createMesh(new THREE.BoxGeometry(4.2, 3.8, 2.5), casingMat, 0, 0, 0, "casing");

        // B. หน้าปัดสเกล (Scale Face)
        const scaleMat = new THREE.MeshBasicMaterial({ map: createScaleTexture() });
        createMesh(new THREE.PlaneGeometry(3.6, 1.8), scaleMat, 0, 0.4, 1.01, "scale");

        // C. ขั้วต่อสายไฟด้านหน้า (Terminals: + และ -)
        const terminalMat = new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.8, roughness: 0.2 });
        createMesh(new THREE.CylinderGeometry(0.12, 0.12, 0.3), new THREE.MeshStandardMaterial({ color: 0xcc3333 }), -1.2, -1.5, 1.1, "terminal"); // ขั้วบวก (แดง)
        createMesh(new THREE.CylinderGeometry(0.12, 0.12, 0.3), new THREE.MeshStandardMaterial({ color: 0x3333cc }), 1.2, -1.5, 1.1, "terminal");  // ขั้วลบ (น้ำเงิน)

        // D. ภายในเครื่อง: แม่เหล็กและแกนกลาง (Magnet & Core)
        const magnetMatN = new THREE.MeshStandardMaterial({ color: 0xcc3333, roughness: 0.3 });
        const magnetMatS = new THREE.MeshStandardMaterial({ color: 0x3366cc, roughness: 0.3 });
        const coreMat = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.8 });

        createMesh(new THREE.BoxGeometry(1.0, 1.8, 1.2), magnetMatN, -1.3, -0.4, 0, "magnet");
        createMesh(new THREE.BoxGeometry(1.0, 1.8, 1.2), magnetMatS, 1.3, -0.4, 0, "magnet");
        createMesh(new THREE.CylinderGeometry(0.4, 0.4, 1.5, 32), coreMat, 0, -0.4, 0, "core");

        // E. ระบบกลุ่มขดลวดและเข็มชี้ที่ขยับได้ (Moving Assembly Group)
        const movingGroup = new THREE.Group();
        movingGroup.position.set(0, -0.4, 0); // จุดหมุนอยู่ตรงกลางแกน
        galvanometerGroup.add(movingGroup);

        // ขดลวดตัวนำ (Coil)
        const coilMat = new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.9, roughness: 0.1 });
        createMesh(new THREE.BoxGeometry(0.8, 1.4, 0.8), coilMat, 0, 0, 0, "coil", movingGroup);

        // เข็มชี้ (Pointer - สีแดงยาวขึ้นไปชี้สเกลด้านบน)
        const pointerMat = new THREE.MeshStandardMaterial({ color: 0xff3333, emissive: 0x331111 });
        createMesh(new THREE.BoxGeometry(0.04, 2.6, 0.04), pointerMat, 0, 1.3, 0.5, "pointer", movingGroup);

        // สปริงก้นหอย (Hairspring)
        const springMat = new THREE.MeshStandardMaterial({ color: 0xffaa00, metalness: 0.7 });
        createMesh(new THREE.TorusGeometry(0.35, 0.04, 16, 40), springMat, 0, -0.8, 0, "spring", movingGroup);

        // F. กระจกใสครอบหน้าปัด (Glass Window)
        const glassMat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, transparent: true, opacity: 0.15, roughness: 0.1, transmission: 0.9, thickness: 0.5 });
        createMesh(new THREE.BoxGeometry(4.0, 3.6, 0.1), glassMat, 0, 0, 1.2, "casing");

        // 5. ข้อมูลคำอธิบายของอวตาร
        const explanations = {
            casing: { title: "ตัวเครื่องและกระจก (Casing & Glass)", desc: "โครงสร้างภายนอกทำหน้าที่ปกป้องกลไกภายใน และมีหน้าต่างกระจกใสเพื่อให้มองเห็นการเบี่ยงเบนของเข็มชี้ได้อย่างชัดเจนครับ" },
            scale: { title: "หน้าปัดสเกล (Scale Plate)", desc: "แผ่นหน้าปัดที่มีขีดบอกค่ากระแสหน่วยมิลลิแอมป์ (mA) พร้อมขีดศูนย์ (0) อยู่ตรงกลางเพื่อให้วัดกระแสได้ทั้งสองทิศทาง" },
            terminal: { title: "ขั้วต่อสายไฟ (Terminals)", desc: "จุดรับกระแสไฟฟ้าเข้าสู่เครื่อง (ขั้วบวกสีแดง และขั้วลบสีน้ำเงิน) เพื่อให้กระแสไหลผ่านเข้าสู่ขดลวดด้านในครับ" },
            magnet: { title: "แม่เหล็กถาวร (Permanent Magnet)", desc: "ขั้วเหนือ (N) และขั้วใต้ (S) สร้างสนามแม่เหล็กถาวรเข้มข้น เพื่อส่งแรงไปเหนี่ยวนำขดลวดที่อยู่ตรงกลางครับ" },
            core: { title: "แกนเหล็กอ่อน (Soft Iron Core)", desc: "วางอยู่ตรงกลางเพื่อช่วยรวมและกระจายเส้นแรงแม่เหล็กให้ตัดกับขดลวดอย่างเป็นระเบียบ ทำให้ค่าความไวแม่เหล็กคงที่" },
            coil: { title: "ขดลวดเคลื่อนที่ (Moving Coil)", desc: "หัวใจสำคัญ! เมื่อมีกระแสไฟฟ้าไหลผ่าน จะเกิดแรงแม่เหล็กไฟฟ้า (F = BIL) ดึงดูดและผลักดันให้เกิดแรงบิดหมุนตัวครับ" },
            pointer: { title: "เข็มชี้ (Pointer)", desc: "ยึดติดอยู่กับแกนขดลวด เมื่อขดลวดหมุน เข็มชี้จะกวาดไปบนสเกลหน้าปัดเพื่อแสดงค่ากระแสไฟฟ้าทันทีครับ" },
            spring: { title: "สปริงก้นหอย (Hairspring)", desc: "ทำหน้าที่สร้าง 'แรงบิดต้าน' เพื่อดึงเข็มกลับสู่ตำแหน่งศูนย์ (0) เมื่อไม่มีกระแส และช่วยสร้างจุดสมดุลให้เข็มหยุดนิ่งแม่นยำครับ" }
        };

        // 6. ระบบควบคุมการขยับเข็มตามสไลเดอร์กระแสไฟฟ้า
        const slider = document.getElementById('currentSlider');
        const currentReadout = document.getElementById('currentReadout');

        slider.addEventListener('input', (e) => {
            const current = parseFloat(e.target.value);
            currentReadout.textContent = `${current > 0 ? '+' : ''}${current.toFixed(1)} mA`;

            // คำนวณมุมการหมุนของกลุ่มขดลวดและเข็ม (แปลงค่ากระแสเป็นเรเดียน)
            // ช่วงสเกล -5 ถึง 5 mA ให้เบี่ยงเบนสูงสุดประมาณ ±0.6 เรเดียน (ประมาณ 35 องศา)
            const targetAngle = - (current / 5) * 0.6;
            
            // อัปเดตรัศมีการหมุนของชุดเคลื่อนที่ทันที
            movingGroup.rotation.y = targetAngle;
        });

        // 7. ระบบตรวจจับการแตะ/คลิกวัตถุ 3D (Raycaster)
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function handleTouchOrClick(clientX, clientY) {
            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(scene.children, true);

            if (intersects.length > 0) {
                let hitObject = intersects[0].object;
                let partName = hitObject.name;

                if (explanations[partName]) {
                    document.getElementById('avatarTitle').textContent = explanations[partName].title;
                    document.getElementById('avatarDesc').textContent = explanations[partName].desc;

                    // เอฟเฟกต์กระพริบเบาๆ ที่กล่องอวตาร
                    const box = document.getElementById('avatarBox');
                    box.style.transform = "scale(1.02)";
                    setTimeout(() => box.style.transform = "scale(1)", 150);

                    highlightObject(hitObject);
                }
            }
        }

        window.addEventListener('touchend', (event) => {
            if (event.changedTouches.length > 0) {
                const touch = event.changedTouches[0];
                handleTouchOrClick(touch.clientX, touch.clientY);
            }
        });

        window.addEventListener('click', (event) => {
            handleTouchOrClick(event.clientX, event.clientY);
        });

        // ฟังก์ชันไฮไลท์ชิ้นส่วนเมื่อถูกคลิก
        let previousMaterial = null;
        let selectedObject = null;
        const highlightMat = new THREE.MeshStandardMaterial({ color: 0xffe600, emissive: 0x443300, roughness: 0.2 });

        function highlightObject(obj) {
            if (selectedObject && selectedObject !== obj) {
                selectedObject.material = previousMaterial;
            }
            if (selectedObject !== obj) {
                previousMaterial = obj.material;
                selectedObject = obj;
                obj.material = highlightMat;

                setTimeout(() => {
                    if (selectedObject === obj) {
                        obj.material = previousMaterial;
                        selectedObject = null;
                    }
                }, 1000);
            }
        }

        // ปรับขนาดหน้าจออัตโนมัติ
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 8. ลูปการแสดงผล 3D
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
