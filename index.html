<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Mobile Galvanometer Simulation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: rgba(25, 25, 25, 0.9);
            --accent-gold: #e2b774;
            --text-main: #e0e0e0;
            --text-muted: #aaaaaa;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* ส่วนหัวด้านบน (Mobile Optimized) */
        .header-panel {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            z-index: 10;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid #333;
            padding: 10px 15px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            pointer-events: none;
        }

        h1 {
            color: var(--accent-gold);
            font-size: 1rem;
            margin: 0 0 2px 0;
        }

        p {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin: 0;
        }

        /* กล่องอวตารด้านล่าง (Mobile Bottom Sheet Style) */
        .avatar-container {
            position: absolute;
            bottom: 20px;
            left: 15px;
            right: 15px;
            z-index: 10;
            background: linear-gradient(135deg, #1e1e1e, #141414);
            border: 2px solid var(--accent-gold);
            border-radius: 14px;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 6px 25px rgba(226, 183, 116, 0.25);
            transition: transform 0.2s ease;
        }

        .avatar-img {
            font-size: 2.2rem;
            background: #2a2a2a;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            flex-shrink: 0;
            border: 2px solid var(--accent-gold);
        }

        .avatar-speech {
            flex-grow: 1;
            overflow: hidden;
        }

        .avatar-title {
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--accent-gold);
            display: block;
            margin-bottom: 2px;
        }

        .avatar-desc {
            font-size: 0.75rem;
            color: #ccc;
            margin: 0;
            line-height: 1.3;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="header-panel">
        <h1>กัลวานอมิเตอร์ 3 มิติ</h1>
        <p>แตะวัตถุใน 3D เพื่อดูคำอธิบาย | ใช้ 1 นิ้วหมุน / 2 นิ้วซูม</p>
    </div>

    <div class="avatar-container" id="avatarBox">
        <div class="avatar-img">🤖</div>
        <div class="avatar-speech">
            <span class="avatar-title" id="avatarTitle">ผู้ช่วยอัจฉริยะมือถือ</span>
            <p class="avatar-desc" id="avatarDesc">จิ้มที่ชิ้นส่วนต่างๆ ในโมเดล 3D ด้านหลังได้เลยครับ!</p>
        </div>
    </div>

    <script>
        // 1. ตั้งค่า Scene, Camera, Renderer (Three.js)
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x121212);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(4, 3, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // ป้องกันกระตุกบนมือถือจอความละเอียดสูง
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // 2. แสงสว่าง
        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        // 3. สร้างกลุ่มชิ้นส่วนกัลวานอมิเตอร์
        const galvanometerGroup = new THREE.Group();
        scene.add(galvanometerGroup);

        function createMesh(geometry, material, x, y, z, name) {
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(x, y, z);
            mesh.name = name;
            galvanometerGroup.add(mesh);
            return mesh;
        }

        // ประกอบร่าง 3D
        createMesh(new THREE.BoxGeometry(1.2, 2.2, 1.5), new THREE.MeshStandardMaterial({ color: 0xcc3333, roughness: 0.3 }), -1.8, 0, 0, "magnet");
        createMesh(new THREE.BoxGeometry(1.2, 2.2, 1.5), new THREE.MeshStandardMaterial({ color: 0x3366cc, roughness: 0.3 }), 1.8, 0, 0, "magnet");
        createMesh(new THREE.CylinderGeometry(0.5, 0.5, 1.8, 32), new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.8 }), 0, 0, 0, "core");
        createMesh(new THREE.BoxGeometry(0.9, 1.6, 0.9), new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.9 }), 0, 0, 0, "coil");
        createMesh(new THREE.CylinderGeometry(0.03, 0.03, 3.5), new THREE.MeshStandardMaterial({ color: 0xffffff }), 0, 1.8, 0, "pointer");
        createMesh(new THREE.TorusGeometry(0.4, 0.05, 16, 50), new THREE.MeshStandardMaterial({ color: 0xffaa00, metalness: 0.7 }), 0, -1.0, 0, "spring");

        // 4. ข้อมูลคำอธิบายของอวตาร
        const explanations = {
            magnet: { title: "แม่เหล็กถาวร (Permanent Magnet)", desc: "สร้างสนามแม่เหล็กเข้มข้นเพื่อส่งแรงไปกระทำกับขดลวดตรงกลางครับ" },
            core: { title: "แกนเหล็กอ่อน (Soft Iron Core)", desc: "ช่วยบังคับเส้นแรงแม่เหล็กให้ตัดกับขดลวดในแนวรัศมีอย่างสม่ำเสมอครับ" },
            coil: { title: "ขดลวด (Moving Coil)", desc: "จุดที่กระแสไฟฟ้าไหลผ่าน เมื่อเจอสนามแม่เหล็กจะทำให้เกิดแรงบิดหมุนครับ" },
            pointer: { title: "เข็มชี้ (Pointer)", desc: "ยึดติดกับแกนหมุน เบี่ยงเบนไปตามค่ากระแสไฟฟ้าที่ไหลผ่านครับ" },
            spring: { title: "สปริงก้นหอย (Hairspring)", desc: "สร้างแรงบิดต้านและดึงเข็มกลับสู่ตำแหน่งศูนย์ (0) เมื่อไม่มีกระแสครับ" }
        };

        // 5. ระบบรองรับทั้ง Touch (มือถือ) และ Click (คอมพิวเตอร์)
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function handleTouchOrClick(clientX, clientY) {
            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(galvanometerGroup.children);

            if (intersects.length > 0) {
                const partName = intersects[0].object.name;
                if (explanations[partName]) {
                    document.getElementById('avatarTitle').textContent = explanations[partName].title;
                    document.getElementById('avatarDesc').textContent = explanations[partName].desc;

                    // เอฟเฟกต์กระพริบเบาๆ ที่กล่องอวตาร
                    const box = document.getElementById('avatarBox');
                    box.style.transform = "scale(1.02)";
                    setTimeout(() => box.style.transform = "scale(1)", 150);

                    highlightObject(intersects[0].object);
                }
            }
        }

        // รองรับการแตะหน้าจอมือถือ (Touch)
        window.addEventListener('touchend', (event) => {
            if (event.changedTouches.length > 0) {
                const touch = event.changedTouches[0];
                handleTouchOrClick(touch.clientX, touch.clientY);
            }
        });

        // รองรับการคลิกด้วยเมาส์ปกติ
        window.addEventListener('click', (event) => {
            handleTouchOrClick(event.clientX, event.clientY);
        });

        // ฟังก์ชันไฮไลท์ชิ้นส่วนเมื่อถูกเลือก
        let previousMaterial = null;
        let selectedObject = null;
        const highlightMat = new THREE.MeshStandardMaterial({ color: 0xffe600, emissive: 0x554400 });

        function highlightObject(obj) {
            if (selectedObject && selectedObject !== obj) {
                selectedObject.material = previousMaterial;
            }
            if (selectedObject !== obj) {
                previousMaterial = obj.material;
                selectedObject = obj;
                obj.material = highlightMat;

                setTimeout(() => {
                    if (selectedObject === obj) {
                        obj.material = previousMaterial;
                        selectedObject = null;
                    }
                }, 1000);
            }
        }

        // ปรับขนาดหน้าจออัตโนมัติเมื่อหมุนจอมือถือ (Orientation Change)
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 6. ลูปการแสดงผล 3D
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
