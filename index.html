<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>โมเดล 2D กัลวานอมิเตอร์ (Galvanometer)</title>
    <style>
        body { font-family: 'Sarabun', sans-serif; display: flex; flex-direction: column; align-items: center; background-color: #f4f4f9; }
        .container { display: flex; gap: 20px; margin-top: 50px; }
        svg { background: white; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); cursor: pointer; }
        .part:hover { opacity: 0.7; stroke: #ff9800; stroke-width: 3; }
        .info-box { width: 300px; padding: 20px; background: white; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { color: #333; margin-top: 0; }
    </style>
</head>
<body>

    <h1>ส่วนประกอบของกัลวานอมิเตอร์</h1>
    
    <div class="container">
        <!-- ภาพวาด 2D แบบ SVG -->
        <svg width="400" height="300" viewBox="0 0 400 300">
            <!-- แม่เหล็ก (Magnet) -->
            <rect class="part" onclick="showInfo('magnet')" x="50" y="100" width="80" height="150" fill="#e74c3c" rx="10"/>
            <rect class="part" onclick="showInfo('magnet')" x="270" y="100" width="80" height="150" fill="#3498db" rx="10"/>
            <text x="85" y="180" fill="white" font-weight="bold">N</text>
            <text x="305" y="180" fill="white" font-weight="bold">S</text>

            <!-- ขดลวด (Coil) -->
            <rect class="part" onclick="showInfo('coil')" x="160" y="120" width="80" height="110" fill="#f1c40f" stroke="#d35400" stroke-width="2"/>
            
            <!-- แกนเหล็กอ่อน (Iron Core) -->
            <circle class="part" onclick="showInfo('core')" cx="200" cy="175" r="30" fill="#95a5a6"/>

            <!-- สปริง (Spring) -->
            <path class="part" onclick="showInfo('spring')" d="M 200 120 Q 220 100 200 90 T 200 70" fill="transparent" stroke="#7f8c8d" stroke-width="3"/>

            <!-- เข็มชี้ (Pointer) -->
            <line class="part" onclick="showInfo('pointer')" x1="200" cy="175" x2="200" y2="40" stroke="black" stroke-width="3"/>

            <!-- หน้าปัด (Scale) -->
            <path class="part" onclick="showInfo('scale')" d="M 100 50 Q 200 10 300 50" fill="transparent" stroke="#2c3e50" stroke-width="4"/>
        </svg>

        <!-- กล่องคำอธิบาย -->
        <div class="info-box">
            <h2 id="part-name">แตะที่ชิ้นส่วนต่างๆ</h2>
            <p id="part-desc">คลิกที่รูปด้านซ้ายเพื่อดูคำอธิบายการทำงานของแต่ละส่วนแบบเข้าใจง่าย</p>
        </div>
    </div>

    <script>
        const data = {
            magnet: { name: "🧲 แม่เหล็กถาวร (Permanent Magnet)", desc: "สร้างสนามแม่เหล็กที่คงที่ โดยมีขั้วเหนือ (N) และขั้วใต้ (S) เพื่อรอให้แม่เหล็กไฟฟ้าจากขดลวดมาผลักหรือดูดขั้วกัน" },
            coil: { name: "⚡ ขดลวด (Coil)", desc: "ลวดทองแดงที่พันรอบแกน เมื่อมีกระแสไฟฟ้าไหลผ่าน ขดลวดนี้จะกลายเป็น 'แม่เหล็กไฟฟ้า' และเกิดแรงผลักกับแม่เหล็กถาวร ทำให้ขดลวดหมุน" },
            core: { name: "⚙️ แกนเหล็กอ่อน (Iron Core)", desc: "อยู่ตรงกลางขดลวด ช่วยรวมและเหนี่ยวนำเส้นแรงแม่เหล็กให้เข้มข้นขึ้น ทำให้ขดลวดหมุนได้แรงและแม่นยำขึ้น" },
            spring: { name: "🌀 สปริงขด (Hairspring)", desc: "คอยดึงรั้งเข็มและขดลวดไม่ให้หมุนไปไกลเกิน และทำหน้าที่ดึงเข็มกลับมาที่เลข 0 เมื่อไม่มีกระแสไฟฟ้า" },
            pointer: { name: "📍 เข็มชี้ (Pointer)", desc: "ติดอยู่กับแกนของขดลวด เมื่อขดลวดหมุน เข็มจะกวาดไปตามหน้าปัดเพื่อบอกปริมาณกระแสไฟฟ้าที่ไหลเข้ามา" },
            scale: { name: "📏 หน้าปัด (Scale)", desc: "แผ่นสเกลที่มีตัวเลขระบุค่า เพื่อให้เราอ่านค่ากระแสไฟฟ้าหรือความต่างศักย์ได้" }
        };

        function showInfo(partKey) {
            document.getElementById('part-name').innerText = data[partKey].name;
            document.getElementById('part-desc').innerText = data[partKey].desc;
        }
    </script>
</body>
</html>
