<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Galvanometer Core Mechanism 3D</title>
    <!-- โหลด Three.js และ OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <style>
        :root {
            --bg-color: #0f1115;
            --card-bg: rgba(25, 28, 36, 0.92);
            --accent-gold: #e2b774;
            --text-main: #f0f0f0;
            --text-muted: #9aa0a6;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* แผงควบคุมด้านบน */
        .control-panel {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            z-index: 10;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 12px 16px;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        h1 {
            color: var(--accent-gold);
            font-size: 0.9rem;
            margin: 0;
        }

        .live-value {
            font-size: 0.85rem;
            color: #4da6ff;
            font-weight: bold;
        }

        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .slider-group label {
            font-size: 0.68rem;
            color: var(--text-muted);
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent-gold);
            height: 5px;
            background: #444;
            border-radius: 3px;
            outline: none;
        }

        /* กล่องอวตารผู้ช่วยด้านล่าง */
        .avatar-container {
            position: absolute;
            bottom: 20px;
            left: 15px;
            right: 15px;
            z-index: 10;
            background: linear-gradient(135deg, #1e222d, #141721);
            border: 2px solid var(--accent-gold);
            border-radius: 14px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 8px 30px rgba(226, 183, 116, 0.2);
            transition: transform 0.2s ease;
        }

        .avatar-img {
            font-size: 2.2rem;
            background: #282c37;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            flex-shrink: 0;
            border: 2px solid var(--accent-gold);
        }

        .avatar-speech {
            flex-grow: 1;
            overflow: hidden;
        }

        .avatar-title {
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--accent-gold);
            display: block;
            margin-bottom: 2px;
        }

        .avatar-desc {
            font-size: 0.75rem;
            color: #d1d5db;
            margin: 0;
            line-height: 1.35;
        }
    </style>
</head>
<body>

    <!-- พื้นที่แสดงผล 3D -->
    <div id="canvas-container"></div>

    <!-- แผงควบคุมด้านบน -->
    <div class="control-panel">
        <div class="header-row">
            <h1>กลไกภายในกัลวานอมิเตอร์ (Core Mechanism)</h1>
            <span id="currentReadout" class="live-value">0.0 mA</span>
        </div>
        <div class="slider-group">
            <label for="currentSlider">ป้อนกระแสไฟฟ้า (ดูการเบี่ยงเบนของขดลวดและเข็มยาว):</label>
            <input type="range" id="currentSlider" min="-5" max="5" step="0.1" value="0">
        </div>
    </div>

    <!-- อวตารอธิบายส่วนประกอบ -->
    <div class="avatar-container" id="avatarBox">
        <div class="avatar-img">🤖</div>
        <div class="avatar-speech">
            <span class="avatar-title" id="avatarTitle">ผู้ช่วยอัจฉริยะ 3D</span>
            <p class="avatar-desc" id="avatarDesc">นี่คือแก่นสำคัญภายในครับ! ลองขยับสไลเดอร์ หรือแตะที่ชิ้นส่วนต่างๆ เพื่อดูคำอธิบายได้เลย</p>
        </div>
    </div>

    <script>
        // 1. ตั้งค่า Scene, Camera, Renderer
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f1115);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2.5, 6.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // 2. แสงสว่าง
        scene.add(new THREE.AmbientLight(0xffffff, 0.85));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        // 3. สร้าง Texture สำหรับป้ายขั้วแม่เหล็ก N และ S
        function createPoleTexture(text, bgColor) {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, 128, 128);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 72px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }

        // 4. สร้างหน้าปัดสเกลลอยตัว
        function createScaleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'rgba(248, 249, 250, 0.9)';
            ctx.fillRect(0, 0, 512, 256);

            ctx.strokeStyle = '#333333';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(256, 220, 160, Math.PI * 1.15, Math.PI * 1.85);
            ctx.stroke();

            ctx.fillStyle = '#111111';
            ctx.font = 'bold 16px Arial';
            ctx.textAlign = 'center';

            for (let i = -5; i <= 5; i++) {
                const ratio = (i + 5) / 10;
                const angle = Math.PI * 1.15 + ratio * (Math.PI * 0.7);
                const x1 = 256 + Math.cos(angle) * 160;
                const y1 = 220 + Math.sin(angle) * 160;
                const x2 = 256 + Math.cos(angle) * (i % 5 === 0 ? 140 : 148);
                const y2 = 220 + Math.sin(angle) * (i % 5 === 0 ? 140 : 148);

                ctx.strokeStyle = i === 0 ? '#cc0000' : '#333333';
                ctx.lineWidth = i % 5 === 0 ? 3 : 1.5;
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();

                if (i % 5 === 0 || i === -2 || i === 2) {
                    const tx = 256 + Math.cos(angle) * 115;
                    const ty = 220 + Math.sin(angle) * 115;
                    ctx.fillText(i.toString(), tx, ty + 6);
                }
            }

            ctx.font = 'bold 12px Arial';
            ctx.fillStyle = '#555555';
            ctx.fillText('MOVING-COIL CORE', 256, 110);
            ctx.fillText('mA', 256, 135);
            return new THREE.CanvasTexture(canvas);
        }

        // 5. ประกอบเฉพาะชิ้นส่วนสำคัญด้านใน
        const coreGroup = new THREE.Group();
        scene.add(coreGroup);

        const partsList = [];

        function addCorePart(mesh, name) {
            mesh.name = name;
            coreGroup.add(mesh);
            partsList.push(mesh);
            return mesh;
        }

        // A. หน้าปัดสเกล (วางไว้ด้านหลังเข็มเพื่ออ้างอิงตำแหน่ง)
        const scaleMat = new THREE.MeshBasicMaterial({ map: createScaleTexture(), transparent: true });
        const scaleMesh = new THREE.Mesh(new THREE.PlaneGeometry(3.6, 1.8), scaleMat);
        scaleMesh.position.set(0, 0.8, -0.2);
        addCorePart(scaleMesh, "scale");

        // B. แม่เหล็กถาวร พร้อมป้าย N และ S ชัดเจน
        const magnetGeo = new THREE.BoxGeometry(1.0, 1.8, 1.2);
        
        // ขั้วเหนือ N
        const magnetN = new THREE.Mesh(magnetGeo, [
            new THREE.MeshStandardMaterial({color: 0xcc3333}),
            createPoleTexture('N', '#cc3333'), // ด้านในหันเข้าแกน
            new THREE.MeshStandardMaterial({color: 0xcc3333}),
            new THREE.MeshStandardMaterial({color: 0xcc3333}),
            new THREE.MeshStandardMaterial({color: 0xcc3333}),
            new THREE.MeshStandardMaterial({color: 0xcc3333})
        ]);
        magnetN.position.set(-1.4, 0, 0);
        addCorePart(magnetN, "magnetN");

        // ขั้วใต้ S
        const magnetS = new THREE.Mesh(magnetGeo, [
            createPoleTexture('S', '#3366cc'), // ด้านในหันเข้าแกน
            new THREE.MeshStandardMaterial({color: 0x3366cc}),
            new THREE.MeshStandardMaterial({color: 0x3366cc}),
            new THREE.MeshStandardMaterial({color: 0x3366cc}),
            new THREE.MeshStandardMaterial({color: 0x3366cc}),
            new THREE.MeshStandardMaterial({color: 0x3366cc})
        ]);
        magnetS.position.set(1.4, 0, 0);
        addCorePart(magnetS, "magnetS");

        // C. แกนเหล็กอ่อนตรงกลาง
        const coreMat = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.8, roughness: 0.2 });
        const coreMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 1.5, 32), coreMat);
        coreMesh.position.set(0, 0, 0);
        addCorePart(coreMesh, "core");

        // D. ชุดเคลื่อนที่ (ขดลวด + เข็มยาวพิเศษ + สปริง)
        const movingGroup = new THREE.Group();
        movingGroup.position.set(0, 0, 0);
        coreGroup.add(movingGroup);

        const coilMat = new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.9, roughness: 0.1 });
        const coilMesh = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.4, 0.8), coilMat);
        coilMesh.name = "coil";
        movingGroup.add(coilMesh);

        // เข็มชี้ขนาดยยาวพิเศษ
        const pointerMat = new THREE.MeshStandardMaterial({ color: 0xff3333, emissive: 0x331111 });
        const pointerMesh = new THREE.Mesh(new THREE.BoxGeometry(0.04, 4.0, 0.04), pointerMat);
        pointerMesh.position.set(0, 2.0, 0.4);
        pointerMesh.name = "pointer";
        movingGroup.add(pointerMesh);

        // สปริงก้นหอย
        const springMat = new THREE.MeshStandardMaterial({ color: 0xffaa00, metalness: 0.7 });
        const springMesh = new THREE.Mesh(new THREE.TorusGeometry(0.35, 0.04, 16, 40), springMat);
        springMesh.position.set(0, -0.8, 0);
        springMesh.rotation.x = Math.PI / 2;
        springMesh.name = "spring";
        movingGroup.add(springMesh);

        // 6. ข้อมูลคำอธิบายชิ้นส่วนภายใน
        const explanations = {
            scale: { title: "หน้าปัดสเกลอ้างอิง (Scale Plate)", desc: "แผ่นสเกลแสดงค่ามิลลิแอมป์ (mA) มีเลข 0 อยู่ตรงกลางเพื่อบอกทิศทางการเบี่ยงเบนครับ" },
            magnetN: { title: "แม่เหล็กถาวร ขั้วเหนือ [ N ]", desc: "ขั้วแม่เหล็กสีแดงมีอักษร [ N ] ชัดเจน ทำหน้าที่ปล่อยเส้นแรงแม่เหล็กออกสู่สนามแม่เหล็กภายใน" },
            magnetS: { title: "แม่เหล็กถาวร ขั้วใต้ [ S ]", desc: "ขั้วแม่เหล็กสีน้ำเงินมีอักษร [ S ] ทำหน้าที่รับเส้นแรงแม่เหล็กให้ครบวงจร" },
            core: { title: "แกนเหล็กอ่อน (Soft Iron Core)", desc: "ทรงกระบอกเหล็กตรงกลาง ช่วยรวมและกระจายเส้นแรงแม่เหล็กให้ตัดกับขดลวดอย่างสม่ำเสมอ" },
            coil: { title: "ขดลวดเคลื่อนที่ (Moving Coil)", desc: "ขดลวดทองแดงที่เมื่อมีกระแสไฟฟ้าไหลผ่าน จะเกิดแรงแม่เหล็กไฟฟ้าผลักดันให้เกิดการบิดหมุน" },
            pointer: { title: "เข็มชี้ขนาดยาวพิเศษ (Pointer)", desc: "ยึดติดกับแกนขดลวด เข็มยาวนี้จะกวาดไปบนสเกลเพื่อแสดงค่ากระแสไฟฟ้าที่เปลี่ยนแปลงทันที" },
            spring: { title: "สปริงก้นหอย (Hairspring)", desc: "สร้างแรงบิดต้านเพื่อให้เข็มหยุดนิ่งในตำแหน่งที่ถูกต้อง และดึงเข็มกลับสู่ศูนย์ (0) เมื่อหยุดจ่ายไฟ" }
        };

        // 7. ระบบควบคุมการขยับเข็มตามสไลเดอร์
        const slider = document.getElementById('currentSlider');
        const currentReadout = document.getElementById('currentReadout');
        let currentVal = 0;

        slider.addEventListener('input', (e) => {
            currentVal = parseFloat(e.target.value);
            currentReadout.textContent = `${currentVal > 0 ? '+' : ''}${currentVal.toFixed(1)} mA`;
        });

        // 8. ระบบตรวจจับการแตะ/คลิกวัตถุ 3D
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function handleTouchOrClick(clientX, clientY) {
            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(coreGroup, true);

            if (intersects.length > 0) {
                let hitObject = intersects[0].object;
                let partName = hitObject.name;
                
                if (hitObject.parent === movingGroup) {
                    partName = hitObject.name;
                }

                if (explanations[partName]) {
                    document.getElementById('avatarTitle').textContent = explanations[partName].title;
                    document.getElementById('avatarDesc').textContent = explanations[partName].desc;

                    const box = document.getElementById('avatarBox');
                    box.style.transform = "scale(1.02)";
                    setTimeout(() => box.style.transform = "scale(1)", 150);

                    highlightObject(hitObject);
                }
            }
        }

        window.addEventListener('touchend', (event) => {
            if (event.changedTouches.length > 0) {
                const touch = event.changedTouches[0];
                handleTouchOrClick(touch.clientX, touch.clientY);
            }
        });

        window.addEventListener('click', (event) => {
            handleTouchOrClick(event.clientX, event.clientY);
        });

        let previousMaterial = null;
        let selectedObject = null;
        const highlightMat = new THREE.MeshStandardMaterial({ color: 0xffe600, emissive: 0x443300, roughness: 0.2 });

        function highlightObject(obj) {
            if (selectedObject && selectedObject !== obj) {
                selectedObject.material = previousMaterial;
            }
            if (selectedObject !== obj) {
                previousMaterial = obj.material;
                selectedObject = obj;
                obj.material = highlightMat;

                setTimeout(() => {
                    if (selectedObject === obj) {
                        obj.material = previousMaterial;
                        selectedObject = null;
                    }
                }, 1000);
            }
        }

        // ปรับขนาดหน้าจออัตโนมัติ
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 9. ลูปการแสดงผล 3D
        function animate() {
            requestAnimationFrame(animate);

            // คำนวณมุมเข็มตามสไลเดอร์กระแสไฟฟ้า
            const targetAngle = - (currentVal / 5) * 0.6;
            movingGroup.rotation.y += (targetAngle - movingGroup.rotation.y) * 0.1;

            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
